<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Progress</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

/* Navbar */

.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0d6efd;
    padding:15px 40px;
}

.logo{
    color:white;
    font-size:28px;
}

.nav-links{
    display:flex;
    list-style:none;
}

.nav-links li{
    margin-left:20px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
}

.nav-links a:hover{
    color:yellow;
}

/* Progress Section */

.container{
    width:80%;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.container h1{
    text-align:center;
    margin-bottom:30px;
    color:#333;
}

.progress-item{
    margin-bottom:25px;
}

.progress-item h3{
    margin-bottom:8px;
}

.progress-bar{
    width:100%;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.progress{
    height:25px;
    background:#0d6efd;
    color:white;
    text-align:center;
    line-height:25px;
    border-radius:20px;
}

/* Footer */

footer{
    margin-top:40px;
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:15px;
}

/* Responsive */

@media(max-width:768px){

.navbar{
    flex-direction:column;
}

.nav-links{
    flex-direction:column;
    margin-top:10px;
}

.nav-links li{
    margin:8px 0;
}

.container{
    width:95%;
}

}

</style>

</head>
<body>

<header>

<nav class="navbar">

<h2 class="logo">LearnHub</h2>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="courses.html">Courses</a></li>
<li><a href="login.html">Logout</a></li>

</ul>

</nav>

</header>

<div class="container">

<h1>Learning Progress</h1>

<div class="progress-item">
<h3>HTML</h3>
<div class="progress-bar">
<div class="progress" id="htmlProgress" style="width:90%;">90%</div>
</div>
</div>

<div class="progress-item">
<h3>CSS</h3>
<div class="progress-bar">
<div class="progress" id="cssProgress" style="width:75%;">75%</div>
</div>
</div>

<div class="progress-item">
<h3>JavaScript</h3>
<div class="progress-bar">
<div class="progress" id="jsProgress" style="width:60%;">60%</div>
</div>
</div>

<div class="progress-item">
<h3>Python</h3>
<div class="progress-bar">
<div class="progress" id="pythonProgress" style="width:50%;">50%</div>
</div>
</div>

</div>

<footer>

<p>© 2026 Student Course Management System</p>

</footer>

<script src="progress.js"></script>

</body>
</html>
