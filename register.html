<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* Navbar */

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:#0d6efd;
            padding:15px 50px;
        }

        .logo{
            color:white;
            font-size:28px;
        }

        .nav-links{
            display:flex;
            list-style:none;
        }

        .nav-links li{
            margin-left:20px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:18px;
        }

        .nav-links a:hover{
            color:yellow;
        }

        /* Form */

        .form-section{
            display:flex;
            justify-content:center;
            align-items:center;
            height:90vh;
        }

        .form-box{
            width:400px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        .form-box h2{
            text-align:center;
            margin-bottom:20px;
        }

        .form-box label{
            display:block;
            margin-top:10px;
            font-weight:bold;
        }

        .form-box input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .form-box button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        .form-box button:hover{
            background:#084298;
        }

        .form-box p{
            text-align:center;
            margin-top:15px;
        }

        .form-box a{
            text-decoration:none;
            color:#0d6efd;
            font-weight:bold;
        }

        span{
            color:red;
            font-size:14px;
        }

        @media(max-width:768px){

            .navbar{
                flex-direction:column;
            }

            .nav-links{
                flex-direction:column;
                margin-top:10px;
            }

            .nav-links li{
                margin:8px 0;
            }

            .form-box{
                width:90%;
            }

        }

    </style>

</head>
<body>

<header>

<nav class="navbar">

<h2 class="logo">LearnHub</h2>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="login.html">Login</a></li>

<li><a href="register.html">Register</a></li>

</ul>

</nav>

</header>

<section class="form-section">

<div class="form-box">

<h2>Student Registration</h2>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your Full Name">
<span id="nameError"></span>

<label>Email</label>
<input type="email" id="email" placeholder="Enter your Email">
<span id="emailError"></span>

<label>Password</label>
<input type="password" id="password" placeholder="Enter Password">
<span id="passwordError"></span>

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm Password">
<span id="confirmError"></span>

<button type="submit">Register</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</section>

<script src="register.js"></script>

</body>
</html>
